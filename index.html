<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Clinic Log</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#CCD3E6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#CCD3E6;
    --bg-2:#DFCEDA;
    --card:#EFF2FA;
    --card-2:#E2E7F4;
    --ink:#3E4666;
    --muted:#78819F;
    --blue:#8DA3D8;
    --blue-deep:#5A6FAE;
    --pink:#DA9CB7;
    --pink-soft:#F4DFE7;
    --pink-deep:#B26B8A;
    --green:#8FBCA6;
    --line:rgba(62,70,102,.13);
    --shadow:0 3px 12px rgba(62,70,102,.12);
    --display:"Quicksand",-apple-system,sans-serif;
    --body:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:linear-gradient(168deg,var(--bg-2) 0%,var(--bg) 45%);
    background-attachment:fixed;min-height:100vh;color:var(--ink);font-family:var(--body);
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:460px;margin:0 auto;padding:22px 16px 104px}

  header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .brand{flex:1;min-width:0}
  .mark{font-family:var(--display);font-weight:700;font-size:27px;color:var(--blue-deep);
    line-height:1}
  .greeting{font-size:12.5px;color:var(--muted);margin-top:5px;font-weight:600;line-height:1.35}
  .mark span{color:var(--pink-deep)}
  .count{font-size:12px;font-weight:700;color:var(--blue-deep);background:var(--card);
    border-radius:999px;padding:7px 13px;box-shadow:var(--shadow)}
  .count.late{color:var(--pink-deep);background:var(--pink-soft)}
  .gear{width:36px;height:36px;flex:none;border:0;background:var(--card);border-radius:12px;
    color:var(--blue-deep);font-size:16px;cursor:pointer;box-shadow:var(--shadow)}
  .stack{display:flex;flex-direction:column;gap:9px;margin-top:16px}
  .stack button{width:100%;padding:14px;border-radius:15px;border:0;cursor:pointer;
    font-family:var(--display);font-size:15px;font-weight:700}
  .outline{background:transparent;border:1.5px solid var(--line);color:var(--blue-deep)}
  .outline.arming{background:var(--pink-deep);border-color:var(--pink-deep);color:#fff}
  .okline{color:#4A7A63;font-size:13px;font-weight:600;margin-top:12px;min-height:18px}

  .tabs{display:flex;gap:5px;background:var(--card);border-radius:16px;padding:5px;
    margin-bottom:18px;box-shadow:var(--shadow)}
  .tabs button{flex:1;border:0;background:none;border-radius:12px;padding:10px 6px;cursor:pointer;
    font-family:var(--display);font-size:14px;font-weight:700;color:var(--muted)}
  .tabs button.on{background:var(--blue);color:#fff}
  .hide{display:none}

  /* ---------- calendar ---------- */
  .monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .monthname{font-family:var(--display);font-weight:700;font-size:19px;color:var(--ink)}
  .nav{display:flex;gap:7px}
  .nav button{width:35px;height:35px;border:0;background:var(--card);border-radius:12px;
    color:var(--blue-deep);font-size:16px;cursor:pointer;box-shadow:var(--shadow)}
  .cal{background:var(--card);border-radius:22px;padding:14px 11px 16px;box-shadow:var(--shadow)}
  .dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .dow div{text-align:center;font-size:10px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);padding-bottom:9px}
  .day{aspect-ratio:1;border:0;background:none;border-radius:13px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-family:var(--body);font-weight:600;font-size:14px;color:var(--ink);padding:0}
  .day.blank{visibility:hidden}
  .day.today{background:var(--pink-soft);color:var(--pink-deep)}
  .day.sel{background:var(--blue);color:#fff}
  .dots{display:flex;gap:3px;height:5px}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--pink)}
  .dot.seen{background:rgba(141,163,216,.5)}
  .day.sel .dot{background:#fff}
  .day.sel .dot.seen{background:rgba(255,255,255,.5)}

  .panel{margin-top:22px}
  .panelhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px}
  .panelhead h2{font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink);margin:0}
  .hint{font-size:11px;color:var(--muted);text-align:right}
  .empty{background:var(--card);border-radius:18px;padding:28px 20px;text-align:center;
    color:var(--muted);font-size:14px;box-shadow:var(--shadow);line-height:1.6}

  /* ---------- appointment card ---------- */
  .appt{background:var(--card);border-radius:18px;padding:13px 14px;margin-bottom:10px;
    display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow);
    border:1.5px solid transparent}
  .appt.seen{opacity:.58}
  .appt.overdue{border-color:var(--pink);background:var(--pink-soft)}
  .tick{width:24px;height:24px;flex:none;margin-top:1px;border-radius:9px;cursor:pointer;
    border:2px solid var(--line);background:var(--card-2);color:transparent;
    font-size:13px;line-height:1;padding:0;transition:background .15s,border-color .15s}
  .tick.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .who{flex:1;min-width:0}
  .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .time{font-family:var(--display);font-weight:700;font-size:13px;color:var(--blue-deep)}
  .name{font-weight:700;font-size:15px}
  .appt.seen .name{text-decoration:line-through;text-decoration-color:var(--muted)}
  .note{font-size:13px;color:var(--muted);margin-top:4px;word-break:break-word;line-height:1.5}
  .flag{font-size:10px;font-weight:700;color:var(--pink-deep);letter-spacing:.07em;
    text-transform:uppercase;background:rgba(178,107,138,.13);border-radius:999px;padding:3px 8px}
  .rowbtns{display:flex;gap:7px;margin-top:10px}
  .mini{border:1.5px solid var(--line);background:transparent;color:var(--blue-deep);
    border-radius:11px;padding:6px 12px;font-family:var(--display);font-size:12px;
    font-weight:700;cursor:pointer}
  .mini.warn{border-color:var(--pink);color:var(--pink-deep)}
  .mini.danger{color:var(--muted)}
  .mini.arming{background:var(--pink-deep);border-color:var(--pink-deep);color:#fff}

  /* ---------- list view ---------- */
  .seg{display:flex;gap:5px;background:var(--card);border-radius:14px;padding:4px;
    margin-bottom:16px;box-shadow:var(--shadow)}
  .seg button{flex:1;border:0;background:none;border-radius:11px;padding:9px;cursor:pointer;
    font-family:var(--display);font-size:13px;font-weight:700;color:var(--muted)}
  .seg button.on{background:var(--pink-soft);color:var(--pink-deep)}
  .daygroup{font-family:var(--display);font-weight:700;font-size:13px;color:var(--muted);
    margin:20px 0 10px;padding-left:2px}
  .daygroup:first-child{margin-top:0}

  /* ---------- quota: dashboard ---------- */
  .dash{background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--shadow);
    margin-bottom:18px;display:flex;align-items:center;gap:18px}
  .ring{flex:none}
  .ring circle{fill:none;stroke-linecap:round}
  .ring .track{stroke:var(--card-2)}
  .ring .fill{stroke:var(--blue-deep);transition:stroke-dasharray .4s ease}
  .ringtext{font-family:var(--display);font-weight:700;fill:var(--ink)}
  .dashinfo h3{font-family:var(--display);font-weight:700;font-size:16px;margin:0 0 5px;color:var(--ink)}
  .dashinfo p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}

  .cat{width:100%;text-align:left;background:var(--card);border:0;border-radius:18px;
    padding:15px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;
    display:flex;align-items:center;gap:14px;font-family:var(--body);color:var(--ink)}
  .catinfo{flex:1;min-width:0}
  .catname{font-family:var(--display);font-weight:700;font-size:15px;margin-bottom:7px}
  .bar{height:7px;border-radius:999px;background:var(--card-2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:var(--blue-deep);
    transition:width .35s ease}
  .catsub{font-size:12px;color:var(--muted);margin-top:6px}
  .chev{color:var(--muted);font-size:18px;flex:none}
  .done .bar i{background:var(--green)}
  .done .ring .fill{stroke:var(--green)}

  .back{background:none;border:0;color:var(--blue-deep);font-family:var(--display);
    font-weight:700;font-size:13px;cursor:pointer;padding:0 0 12px;display:block}
  .qhead{font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink);margin:0 0 4px}
  .qsub{font-size:13px;color:var(--muted);margin-bottom:16px}

  /* ---------- quota: requirement rows ---------- */
  .req{width:100%;text-align:left;background:var(--card);border:0;border-radius:16px;
    padding:13px 15px;margin-bottom:9px;box-shadow:var(--shadow);cursor:pointer;
    display:flex;align-items:center;gap:12px;font-family:var(--body);color:var(--ink)}
  .reqinfo{flex:1;min-width:0}
  .reqname{font-weight:700;font-size:14px;margin-bottom:6px}
  .reqcount{font-family:var(--display);font-weight:700;font-size:13px;color:var(--blue-deep);
    background:var(--card-2);border-radius:999px;padding:5px 11px;white-space:nowrap;flex:none}
  .req.full .reqcount{color:#4A7A63;background:rgba(143,188,166,.26)}
  .req.full .bar i{background:var(--green)}

  /* ---------- quota: detail ---------- */
  .bigstat{background:var(--card);border-radius:22px;padding:22px 20px;box-shadow:var(--shadow);
    margin-bottom:18px;text-align:center}
  .bignum{font-family:var(--display);font-weight:700;font-size:42px;line-height:1;
    color:var(--blue-deep)}
  .bignum.done{color:#4A7A63}
  .biglabel{font-size:14px;color:var(--muted);margin-top:8px}
  .bigbar{height:9px;border-radius:999px;background:var(--card-2);overflow:hidden;margin-top:16px}
  .bigbar i{display:block;height:100%;border-radius:999px;background:var(--blue-deep);
    transition:width .35s ease}
  .bigbar.done i{background:var(--green)}

  .entry{background:var(--card);border-radius:15px;padding:12px 14px;margin-bottom:9px;
    box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
  .entryinfo{flex:1;min-width:0}
  .entryname{font-weight:700;font-size:14px;word-break:break-word}
  .entrydate{font-size:12px;color:var(--muted);margin-top:3px}
  .num{font-family:var(--display);font-weight:700;font-size:12px;color:var(--muted);
    background:var(--card-2);border-radius:999px;width:26px;height:26px;flex:none;
    display:flex;align-items:center;justify-content:center}

  .addrow{display:flex;gap:8px;margin-top:16px}
  .addrow input{flex:1;padding:13px;border:1.5px solid var(--line);border-radius:14px;
    font-family:var(--body);font-size:16px;background:var(--card);color:var(--ink)}
  .addrow button{flex:none;padding:0 20px;border:0;border-radius:14px;background:var(--blue-deep);
    color:#fff;font-family:var(--display);font-weight:700;font-size:14px;cursor:pointer}

  /* ---------- form ---------- */
  .add{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(20px + env(safe-area-inset-bottom));
    background:var(--blue-deep);color:#fff;border:0;border-radius:999px;
    padding:15px 30px;font-family:var(--display);font-weight:700;font-size:15px;
    box-shadow:0 6px 20px rgba(62,70,102,.28);cursor:pointer}
  dialog{border:0;border-radius:26px 26px 0 0;
    padding:24px 18px calc(24px + env(safe-area-inset-bottom));
    width:100%;max-width:460px;margin:auto auto 0;background:var(--card);color:var(--ink);
    max-height:88vh;overflow-y:auto}
  dialog::backdrop{background:rgba(62,70,102,.4)}
  dialog h3{font-family:var(--display);font-weight:700;font-size:19px;color:var(--ink);margin:0}
  .sub{font-size:13px;color:var(--muted);margin-top:5px}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:13px 0 5px}
  input,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:14px;
    font-family:var(--body);font-size:16px;background:var(--card-2);color:var(--ink)}
  input::placeholder,textarea::placeholder{color:rgba(120,129,159,.75)}
  textarea{resize:vertical;min-height:66px}
  .row{display:flex;gap:10px}
  .row>div{flex:1}
  .warnline{color:var(--pink-deep);font-size:13px;font-weight:600;margin-top:12px;min-height:18px}
  .actions{display:flex;gap:10px;margin-top:14px}
  .actions button{flex:1;padding:14px;border-radius:15px;font-family:var(--display);
    font-size:15px;font-weight:700;cursor:pointer;border:0}
  .ghost{background:var(--card-2);color:var(--muted)}
  .solid{background:var(--blue-deep);color:#fff}
  .px{border:0;background:none;color:var(--muted);font-size:17px;cursor:pointer;padding:2px 5px;
    line-height:1;flex:none}
  .px.arming{color:var(--pink-deep);font-size:12px;font-weight:700;font-family:var(--display)}
  :focus-visible{outline:2.5px solid var(--pink-deep);outline-offset:2px}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark" id="hello"></div>
      <div class="greeting" id="greeting"></div>
    </div>
    <div class="count" id="count"></div>
    <button class="gear" id="gear" aria-label="Backup and restore">&#9881;</button>
  </header>

  <div class="tabs">
    <button id="tabCal" class="on">Calendar</button>
    <button id="tabList">Caseload</button>
    <button id="tabQuota">Quota</button>
  </div>

  <!-- ============ CALENDAR ============ -->
  <section id="viewCal">
    <div class="monthbar">
      <div class="monthname" id="monthname"></div>
      <div class="nav">
        <button id="prev" aria-label="Previous month">&#8249;</button>
        <button id="next" aria-label="Next month">&#8250;</button>
      </div>
    </div>
    <div class="cal">
      <div class="dow"><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="panel">
      <div class="panelhead">
        <h2 id="dayLabel"></h2>
        <div class="hint">Tap the day again to add</div>
      </div>
      <div id="dayList"></div>
    </div>
  </section>

  <!-- ============ LIST ============ -->
  <section id="viewList" class="hide">
    <div class="seg">
      <button id="segUp" class="on">Pending</button>
      <button id="segPast">Completed</button>
    </div>
    <div id="feed"></div>
  </section>

  <!-- ============ QUOTA ============ -->
  <section id="viewQuota" class="hide">
    <div id="quotaBody"></div>
  </section>
</div>

<button class="add" id="add">+ New appointment</button>

<dialog id="bdlg">
  <h3>Backup</h3>
  <div class="sub">Everything lives on this phone only. Save a copy somewhere safe now and then — email it to yourself, or drop it in Files.</div>
  <div class="stack">
    <button class="solid" id="doExport">Export a backup</button>
    <button class="outline" id="pickFile">Restore from a backup</button>
  </div>
  <input type="file" id="fileIn" accept="application/json,.json" style="display:none">
  <div class="okline"  id="bok"></div>
  <div class="warnline" id="bwarn"></div>
  <div class="actions">
    <button class="ghost" id="bclose">Close</button>
  </div>
</dialog>

<dialog id="rdlg">
  <h3>Restore</h3>
  <div class="sub" id="rsub"></div>
  <div class="stack">
    <button class="solid"  id="rMerge">Add to what's here</button>
    <button class="outline" id="rReplace">Replace everything</button>
  </div>
  <div class="warnline" id="rwarn"></div>
  <div class="actions">
    <button class="ghost" id="rcancel">Cancel</button>
  </div>
</dialog>

<dialog id="dlg">
  <h3 id="dlgTitle">New appointment</h3>
  <div class="sub" id="dlgSub"></div>
  <div class="row">
    <div><label for="f-date">Date</label><input type="date" id="f-date"></div>
    <div><label for="f-time">Time</label><input type="time" id="f-time"></div>
  </div>
  <label for="f-name">Patient name</label>
  <input id="f-name" autocomplete="off" placeholder="e.g. Nurul Aina">
  <label for="f-note">Notes (optional)</label>
  <textarea id="f-note" placeholder="Anything worth remembering"></textarea>
  <div class="warnline" id="warn"></div>
  <div class="actions">
    <button class="ghost" id="cancel">Cancel</button>
    <button class="solid" id="save">Save</button>
  </div>
</dialog>

<script>
/* ---------------------------------------------------------------
   STORAGE — everything stays on this phone. Nothing is sent anywhere.
---------------------------------------------------------------- */
const A_KEY = "rounds.appointments.v3";
const Q_KEY = "rounds.quota.v1";

async function readKey(key, fallback){
  try{
    if (window.storage){                                    // preview only
      const r = await window.storage.get(key);
      return r ? JSON.parse(r.value) : fallback;
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
async function writeKey(key, data){
  try{
    if (window.storage) await window.storage.set(key, JSON.stringify(data));
    else localStorage.setItem(key, JSON.stringify(data));
    return true;
  }catch(e){ return false; }
}
const saveAppts = ()=> writeKey(A_KEY, appts);
const saveQuota = ()=> writeKey(Q_KEY, quota);

/* ---------------------------------------------------------------
   THE LOGBOOK — four categories, each with its required cases.
   Edit the numbers here if the requirements change.
---------------------------------------------------------------- */
const DEFAULT_QUOTA = [
  { id:"oral", name:"Oral surgery", items:[
    { id:"os1", name:"Extractions with review",   target:20, entries:[] },
    { id:"os2", name:"Minor surgery with review", target:5,  entries:[] },
    { id:"os3", name:"PRP",                       target:1,  entries:[] },
    { id:"os4", name:"Hair transplant",           target:1,  entries:[] }
  ]},
  { id:"perio", name:"Periodontics", items:[
    { id:"pe1", name:"Scaling with review", target:15, entries:[] },
    { id:"pe2", name:"Flap surgery",        target:1,  entries:[] },
    { id:"pe3", name:"Minor surgery",       target:7,  entries:[] }
  ]},
  { id:"prostho", name:"Prosthodontics", items:[
    { id:"pr1", name:"CPD",             target:10, entries:[] },
    { id:"pr2", name:"FPD",             target:8,  entries:[] },
    { id:"pr3", name:"CD",              target:4,  entries:[] },
    { id:"pr4", name:"Occlusal splint", target:1,  entries:[] }
  ]},
  { id:"consendo", name:"Conservative & Endodontics", items:[
    { id:"ce1",  name:"Class 1 LCR",         target:5,  entries:[] },
    { id:"ce2",  name:"Class 2 LCR",         target:10, entries:[] },
    { id:"ce3",  name:"Class 3/4 LCR",       target:10, entries:[] },
    { id:"ce4",  name:"Class 5 LCR",         target:5,  entries:[] },
    { id:"ce5",  name:"Anterior RCT",        target:6,  entries:[] },
    { id:"ce6",  name:"Premolar RCT",        target:2,  entries:[] },
    { id:"ce7",  name:"Molar RCT",           target:2,  entries:[] },
    { id:"ce8",  name:"Post and core",       target:1,  entries:[] },
    { id:"ce9",  name:"Composite veneering", target:5,  entries:[] },
    { id:"ce10", name:"Class 1 inlay",       target:1,  entries:[] },
    { id:"ce11", name:"Class 2 inlay",       target:1,  entries:[] },
    { id:"ce12", name:"Tunnel prep",         target:2,  entries:[] }
  ]}
];

/* ---------------------------------------------------------------
   STATE
---------------------------------------------------------------- */
let appts = [];
let quota = [];
let view  = new Date();
let sel   = iso(new Date());
let tab   = "cal";
let seg   = "up";
let editingId = null;
let armed  = null;
let qarmed = null;                 // entry id awaiting a second delete tap
let qCat   = null;                 // open category id
let qItem  = null;                 // open requirement id

function iso(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function when(a){ return new Date(a.date + "T" + a.time); }
function byTime(a,b){ return when(a) - when(b); }
function forDay(day){ return appts.filter(a=>a.date===day).sort(byTime); }
function isOverdue(a){ return !a.seen && when(a) < new Date(); }
function pretty(dstr, opts){
  const [y,m,d] = dstr.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,
    opts || { weekday:"long", day:"numeric", month:"long" });
}

/* counting helpers — done is capped at target so extras can't skew a bar */
function itemDone(it){ return Math.min(it.entries.length, it.target); }
function catTotals(c){
  return c.items.reduce((acc,it)=>{
    acc.done += itemDone(it); acc.target += it.target; return acc;
  }, {done:0, target:0});
}
function allTotals(){
  return quota.reduce((acc,c)=>{
    const t = catTotals(c); acc.done += t.done; acc.target += t.target; return acc;
  }, {done:0, target:0});
}

/* ---------------------------------------------------------------
   APPOINTMENT CARD
---------------------------------------------------------------- */
function card(a){
  const overdue = isOverdue(a);
  const el = document.createElement("div");
  el.className = "appt" + (a.seen ? " seen" : "") + (overdue ? " overdue" : "");

  const tick = document.createElement("button");
  tick.className = "tick" + (a.seen ? " on" : "");
  tick.textContent = "\u2713";
  tick.setAttribute("aria-pressed", a.seen ? "true" : "false");
  tick.setAttribute("aria-label", a.seen ? "Mark as not completed" : "Mark patient as completed");
  tick.onclick = async ()=>{
    a.seen = !a.seen;
    a.seenAt = a.seen ? new Date().toISOString() : null;
    await saveAppts(); render();
  };

  const who = document.createElement("div");
  who.className = "who";

  const top = document.createElement("div");
  top.className = "top";
  const t = document.createElement("span"); t.className = "time"; t.textContent = a.time;
  const n = document.createElement("span"); n.className = "name"; n.textContent = a.name;
  top.append(t, n);
  if (overdue){
    const f = document.createElement("span");
    f.className = "flag"; f.textContent = "Overdue";
    top.appendChild(f);
  }
  who.appendChild(top);

  if (a.note){
    const note = document.createElement("div");
    note.className = "note"; note.textContent = a.note;
    who.appendChild(note);
  }

  const btns = document.createElement("div");
  btns.className = "rowbtns";

  const edit = document.createElement("button");
  edit.className = "mini" + (overdue ? " warn" : "");
  edit.textContent = overdue ? "Reschedule" : "Edit";
  edit.onclick = ()=>{ armed = null; openForm(a.id); };

  const isArmed = armed === a.id;
  const del = document.createElement("button");
  del.className = "mini " + (isArmed ? "arming" : "danger");
  del.textContent = isArmed ? "Tap again to delete" : "Delete";
  del.onclick = async ()=>{
    if (armed !== a.id){
      armed = a.id; render();
      setTimeout(()=>{ if (armed === a.id){ armed = null; render(); } }, 3500);
      return;
    }
    armed = null;
    appts = appts.filter(x => x.id !== a.id);
    await saveAppts(); render();
  };

  btns.append(edit, del);
  who.appendChild(btns);
  el.append(tick, who);
  return el;
}

/* ---------------------------------------------------------------
   RENDER
---------------------------------------------------------------- */
/* Change NAME to whatever she'd like to be called.
   One line a day, picked by the date so it doesn't flicker as she taps. */
const NAME = "Fattie";
const GREETINGS = [
  "Today is gonna be great.",
  "Today is a good day.",
  "One case at a time.",
  "Small steps still count.",
  "You've got this.",
  "Good work, quietly done.",
  "Take it gently today."
];
function setGreeting(){
  const d = new Date();
  const dayNumber = Math.floor(d.getTime()/86400000) + d.getDay();

  const hello = document.getElementById("hello");
  hello.textContent = "Hi, ";
  const who = document.createElement("span");
  who.textContent = NAME;                 // pink, like the old full stop
  hello.appendChild(who);

  document.getElementById("greeting").textContent =
    GREETINGS[dayNumber % GREETINGS.length];
}

function render(){
  ["Cal","List","Quota"].forEach(v=>{
    document.getElementById("view"+v).classList.toggle("hide", tab!==v.toLowerCase());
    document.getElementById("tab"+v).classList.toggle("on",   tab===v.toLowerCase());
  });
  document.getElementById("add").classList.toggle("hide", tab==="quota");

  const waiting = appts.filter(a=>!a.seen).length;
  const late    = appts.filter(isOverdue).length;
  const badge   = document.getElementById("count");

  if (tab==="quota"){
    const t = allTotals();
    badge.textContent = t.done + " / " + t.target;
    badge.classList.remove("late");
  } else {
    badge.textContent = late ? late + " overdue" : waiting ? waiting + " pending" : "All clear";
    badge.classList.toggle("late", late > 0);
  }

  if      (tab==="cal")  renderCal();
  else if (tab==="list") renderFeed();
  else                   renderQuota();
}

function renderCal(){
  const y = view.getFullYear(), m = view.getMonth();
  document.getElementById("monthname").textContent =
    view.toLocaleDateString(undefined,{ month:"long", year:"numeric" });

  const firstDow = (new Date(y,m,1).getDay() + 6) % 7;
  const total    = new Date(y,m+1,0).getDate();
  const todayIso = iso(new Date());
  const grid     = document.getElementById("grid");
  grid.innerHTML = "";

  for (let i=0;i<firstDow;i++){
    const b = document.createElement("div"); b.className = "day blank"; grid.appendChild(b);
  }

  for (let d=1; d<=total; d++){
    const dayIso = iso(new Date(y,m,d));
    const btn = document.createElement("button");
    btn.className = "day" + (dayIso===todayIso?" today":"") + (dayIso===sel?" sel":"");
    btn.innerHTML = "<span>"+d+"</span>";

    const dots = document.createElement("div");
    dots.className = "dots";
    forDay(dayIso).slice(0,3).forEach(a=>{
      const i = document.createElement("i");
      i.className = "dot" + (a.seen ? " seen" : "");
      dots.appendChild(i);
    });
    btn.appendChild(dots);

    btn.onclick = ()=>{
      armed = null;
      if (sel === dayIso) openForm(null, dayIso);
      else { sel = dayIso; render(); }
    };
    grid.appendChild(btn);
  }

  document.getElementById("dayLabel").textContent = pretty(sel);
  const list  = document.getElementById("dayList");
  const items = forDay(sel);
  list.innerHTML = "";

  if (!items.length){
    list.innerHTML = '<div class="empty">Nothing booked.<br>Tap this day again to add someone.</div>';
    return;
  }
  items.forEach(a=> list.appendChild(card(a)));
}

function renderFeed(){
  document.getElementById("segUp").classList.toggle("on", seg==="up");
  document.getElementById("segPast").classList.toggle("on", seg==="past");

  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  const items = seg==="up"
    ? appts.filter(a=>!a.seen).sort(byTime)
    : appts.filter(a=> a.seen).sort((a,b)=> byTime(b,a));

  if (!items.length){
    feed.innerHTML = '<div class="empty">' +
      (seg==="up" ? "No pending patients." : "No completed patients yet.") + '</div>';
    return;
  }

  let heading = null;
  const todayIso = iso(new Date());
  items.forEach(a=>{
    if (a.date !== heading){
      heading = a.date;
      const h = document.createElement("div");
      h.className = "daygroup";
      h.textContent = a.date===todayIso
        ? "Today \u00B7 " + pretty(a.date,{day:"numeric",month:"long"})
        : pretty(a.date,{weekday:"short",day:"numeric",month:"long"});
      feed.appendChild(h);
    }
    feed.appendChild(card(a));
  });
}

/* ---------------------------------------------------------------
   QUOTA — three levels: categories, one category, one requirement
---------------------------------------------------------------- */
function ring(done, target, size){
  const r = (size/2) - 6, c = 2 * Math.PI * r;
  const pct = target ? Math.min(done/target, 1) : 0;
  const full = target && done >= target;
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle class="track" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke-width="8"/>'+
    '<circle class="fill" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke-width="8" '+
      'stroke-dasharray="'+(c*pct)+' '+c+'" transform="rotate(-90 '+size/2+' '+size/2+')" '+
      (full ? 'stroke="#8FBCA6"' : '') + '/>'+
    '<text class="ringtext" x="50%" y="50%" text-anchor="middle" dominant-baseline="central" '+
      'font-size="'+(size*0.24)+'">'+Math.round(pct*100)+'%</text></svg>';
}

function renderQuota(){
  const body = document.getElementById("quotaBody");
  body.innerHTML = "";

  if      (qItem) renderQuotaItem(body);
  else if (qCat)  renderQuotaCat(body);
  else            renderQuotaHome(body);
}

/* --- level 1: dashboard + the four categories --- */
function renderQuotaHome(body){
  const t = allTotals();
  const left = Math.max(0, t.target - t.done);

  const dash = document.createElement("div");
  dash.className = "dash" + (left===0 ? " done" : "");
  dash.innerHTML = ring(t.done, t.target, 96) +
    '<div class="dashinfo"><h3>' + (left===0 ? "All targets met" : left + " cases to go") + '</h3>' +
    '<p>' + t.done + ' of ' + t.target + ' cases recorded so far.</p></div>';
  body.appendChild(dash);

  quota.forEach(c=>{
    const tot  = catTotals(c);
    const pct  = tot.target ? (tot.done/tot.target)*100 : 0;
    const full = tot.done >= tot.target;

    const b = document.createElement("button");
    b.className = "cat" + (full ? " done" : "");
    b.innerHTML =
      '<div class="catinfo"><div class="catname"></div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="catsub">'+tot.done+' of '+tot.target+' cases \u00B7 '+c.items.length+' procedures</div></div>'+
      '<div class="chev">\u203A</div>';
    b.querySelector(".catname").textContent = c.name;
    b.onclick = ()=>{ qCat = c.id; qarmed = null; render(); window.scrollTo(0,0); };
    body.appendChild(b);
  });
}

/* --- level 2: the requirements inside one category --- */
function renderQuotaCat(body){
  const c   = quota.find(x=>x.id===qCat);
  const tot = catTotals(c);

  const back = document.createElement("button");
  back.className = "back"; back.textContent = "\u2039  All departments";
  back.onclick = ()=>{ qCat = null; render(); window.scrollTo(0,0); };
  body.appendChild(back);

  const h = document.createElement("div");
  h.className = "qhead"; h.textContent = c.name;
  body.appendChild(h);

  const s = document.createElement("div");
  s.className = "qsub"; s.textContent = tot.done + " of " + tot.target + " cases recorded";
  body.appendChild(s);

  c.items.forEach(it=>{
    const done = itemDone(it);
    const pct  = it.target ? (done/it.target)*100 : 0;
    const full = done >= it.target;

    const b = document.createElement("button");
    b.className = "req" + (full ? " full" : "");
    b.innerHTML =
      '<div class="reqinfo"><div class="reqname"></div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div></div>'+
      '<div class="reqcount">'+done+' / '+it.target+'</div>';
    b.querySelector(".reqname").textContent = it.name;
    b.onclick = ()=>{ qItem = it.id; qarmed = null; render(); window.scrollTo(0,0); };
    body.appendChild(b);
  });
}

/* --- level 3: one requirement, with its logged cases --- */
function renderQuotaItem(body){
  const c  = quota.find(x=>x.id===qCat);
  const it = c.items.find(x=>x.id===qItem);
  const done = itemDone(it);
  const left = Math.max(0, it.target - it.entries.length);
  const pct  = it.target ? (done/it.target)*100 : 0;

  const back = document.createElement("button");
  back.className = "back"; back.textContent = "\u2039  " + c.name;
  back.onclick = ()=>{ qItem = null; render(); window.scrollTo(0,0); };
  body.appendChild(back);

  const h = document.createElement("div");
  h.className = "qhead"; h.textContent = it.name;
  body.appendChild(h);

  const stat = document.createElement("div");
  stat.className = "bigstat";
  stat.innerHTML =
    '<div class="bignum'+(left===0?" done":"")+'">'+(left===0 ? "\u2713" : left)+'</div>'+
    '<div class="biglabel">'+
      (left===0 ? "Target met \u2014 " + it.entries.length + " recorded"
                : (left===1 ? "1 more to go" : left + " more to go") + " \u00B7 " + it.entries.length + " of " + it.target)+
    '</div>'+
    '<div class="bigbar'+(left===0?" done":"")+'"><i style="width:'+pct+'%"></i></div>';
  body.appendChild(stat);

  /* logged cases, newest first */
  const listWrap = document.createElement("div");
  if (!it.entries.length){
    listWrap.innerHTML = '<div class="empty">No cases recorded yet.<br>Add the first one below.</div>';
  } else {
    it.entries.slice().reverse().forEach((e, idx)=>{
      const row = document.createElement("div");
      row.className = "entry";

      const num = document.createElement("div");
      num.className = "num";
      num.textContent = it.entries.length - idx;

      const info = document.createElement("div");
      info.className = "entryinfo";
      const nm = document.createElement("div");
      nm.className = "entryname"; nm.textContent = e.name;
      const dt = document.createElement("div");
      dt.className = "entrydate";
      dt.textContent = pretty(e.date, {day:"numeric", month:"short", year:"numeric"});
      info.append(nm, dt);

      const isArmed = qarmed === e.id;
      const x = document.createElement("button");
      x.className = "px" + (isArmed ? " arming" : "");
      x.textContent = isArmed ? "Sure?" : "\u00D7";
      x.setAttribute("aria-label","Remove this case");
      x.onclick = async ()=>{
        if (qarmed !== e.id){
          qarmed = e.id; render();
          setTimeout(()=>{ if (qarmed === e.id){ qarmed = null; render(); } }, 3500);
          return;
        }
        qarmed = null;
        it.entries = it.entries.filter(z => z.id !== e.id);
        await saveQuota(); render();
      };

      row.append(num, info, x);
      listWrap.appendChild(row);
    });
  }
  body.appendChild(listWrap);

  /* add a case */
  const addrow = document.createElement("div");
  addrow.className = "addrow";
  const input = document.createElement("input");
  input.placeholder = "Patient name";
  input.autocomplete = "off";
  input.setAttribute("aria-label","Patient name for this case");
  const btn = document.createElement("button");
  btn.textContent = "Log";

  const submit = async ()=>{
    const name = input.value.trim();
    if (!name){ input.focus(); return; }
    it.entries.push({ id: Date.now().toString(36), name, date: iso(new Date()) });
    await saveQuota();
    input.value = "";
    render();
    // put the cursor back so several can be logged in a row
    const again = document.querySelector("#quotaBody .addrow input");
    if (again) again.focus();
  };
  btn.onclick = submit;
  input.onkeydown = e=>{ if (e.key === "Enter") submit(); };

  addrow.append(input, btn);
  body.appendChild(addrow);
}

/* ---------------------------------------------------------------
   APPOINTMENT FORM
---------------------------------------------------------------- */
const dlg  = document.getElementById("dlg");
const warn = document.getElementById("warn");

function openForm(id, dateOverride){
  editingId = id || null;
  const a = id ? appts.find(x=>x.id===id) : null;
  const overdue = a && isOverdue(a);

  document.getElementById("dlgTitle").textContent =
    !a ? "New appointment" : overdue ? "Reschedule" : "Edit appointment";
  document.getElementById("dlgSub").textContent =
    overdue ? "This one has passed. Pick a new date and time." : "";

  document.getElementById("f-date").value =
    a ? a.date : (dateOverride || (tab==="cal" ? sel : iso(new Date())));
  document.getElementById("f-time").value = a ? a.time : "09:00";
  document.getElementById("f-name").value = a ? a.name : "";
  document.getElementById("f-note").value = a && a.note ? a.note : "";
  document.getElementById("save").textContent = a ? "Save changes" : "Save";
  warn.textContent = "";

  dlg.showModal();
  document.getElementById(a ? "f-date" : "f-name").focus();
}

document.getElementById("add").onclick    = ()=>{ armed = null; openForm(null); };
document.getElementById("cancel").onclick = ()=> dlg.close();

document.getElementById("save").onclick = async ()=>{
  const name = document.getElementById("f-name").value.trim();
  const date = document.getElementById("f-date").value;
  const time = document.getElementById("f-time").value;
  const note = document.getElementById("f-note").value.trim();

  if (!name || !date || !time){
    warn.textContent = "Name, date and time are all needed.";
    return;
  }

  if (editingId){
    const a = appts.find(x=>x.id===editingId);
    if (a.seen && when({date,time}) > new Date()){ a.seen = false; a.seenAt = null; }
    Object.assign(a, { date, time, name, note });
  } else {
    appts.push({ id: Date.now().toString(36), date, time, name, note, seen:false, seenAt:null });
  }

  if (!await saveAppts()){ warn.textContent = "Couldn't save \u2014 storage is full or blocked."; return; }

  sel  = date;
  view = new Date(date + "T00:00:00");
  editingId = null;
  dlg.close();
  render();
};

/* ---------------------------------------------------------------
   BACKUP  —  export writes one file holding appointments + logbook.
   Restore reads it back, either merging or replacing.
---------------------------------------------------------------- */
const bdlg  = document.getElementById("bdlg");
const rdlg  = document.getElementById("rdlg");
const bok   = document.getElementById("bok");
const bwarn = document.getElementById("bwarn");
let pending = null;                       // parsed file waiting on merge/replace

document.getElementById("gear").onclick = ()=>{
  bok.textContent = ""; bwarn.textContent = "";
  bdlg.showModal();
};
document.getElementById("bclose").onclick = ()=> bdlg.close();

document.getElementById("doExport").onclick = async ()=>{
  bok.textContent = ""; bwarn.textContent = "";

  const payload = {
    app:"rounds", version:1,
    exportedAt: new Date().toISOString(),
    appointments: appts,
    quota: quota
  };
  const text = JSON.stringify(payload, null, 2);
  const filename = "clinic-log-backup-" + iso(new Date()) + ".json";

  /* Share sheet first — that's what lets her mail it to herself
     straight from the phone. Falls back to a plain download. */
  try{
    const file = new File([text], filename, { type:"application/json" });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:"Clinic Log backup" });
      bok.textContent = "Backup shared.";
      return;
    }
  }catch(e){
    if (e && e.name === "AbortError"){ return; }     // she tapped cancel
  }

  try{
    const url = URL.createObjectURL(new Blob([text], { type:"application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
    bok.textContent = "Saved as " + filename;
  }catch(e){
    bwarn.textContent = "Couldn't export here. Try from the installed app.";
  }
};

document.getElementById("pickFile").onclick = ()=> document.getElementById("fileIn").click();

document.getElementById("fileIn").onchange = async (ev)=>{
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = "";                              // let the same file be picked twice
  if (!file) return;

  bok.textContent = ""; bwarn.textContent = "";

  try{
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.appointments) || !Array.isArray(data.quota)){
      bwarn.textContent = "That file isn't a Clinic Log backup.";
      return;
    }
    pending = data;

    const cases = data.quota.reduce((sum,c)=>
      sum + c.items.reduce((s,i)=> s + (i.entries ? i.entries.length : 0), 0), 0);
    const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");
    document.getElementById("rsub").textContent =
      "This backup holds " + plural(data.appointments.length, "appointment") + " and " +
      plural(cases, "logged case") + ", saved " + pretty(data.exportedAt.slice(0,10)) + ".";

    document.getElementById("rwarn").textContent = "";
    rdlg.showModal();
  }catch(e){
    bwarn.textContent = "Couldn't read that file.";
  }
};

document.getElementById("rcancel").onclick = ()=>{ pending = null; rdlg.close(); };

async function applyRestore(replace){
  if (!pending) return;

  if (replace){
    appts = pending.appointments;
    quota = pending.quota;
  } else {
    /* merge: skip appointments we already have, and add only
       logbook cases whose id isn't present yet */
    const have = new Set(appts.map(a=>a.id));
    pending.appointments.forEach(a=>{ if (!have.has(a.id)) appts.push(a); });

    pending.quota.forEach(pc=>{
      const c = quota.find(x=>x.id===pc.id);
      if (!c) { quota.push(pc); return; }
      pc.items.forEach(pi=>{
        const it = c.items.find(x=>x.id===pi.id);
        if (!it) { c.items.push(pi); return; }
        const seen = new Set(it.entries.map(e=>e.id));
        (pi.entries||[]).forEach(e=>{ if (!seen.has(e.id)) it.entries.push(e); });
      });
    });
  }

  const a = await saveAppts(), b = await saveQuota();
  if (!a || !b){
    document.getElementById("rwarn").textContent = "Restored, but saving failed.";
    return;
  }

  pending = null;
  rdlg.close(); bdlg.close();
  qCat = null; qItem = null;
  bok.textContent = "";
  render();
}

document.getElementById("rMerge").onclick = ()=> applyRestore(false);

/* Replace wipes what's on the phone, so it asks twice. */
let replaceArmed = false;
document.getElementById("rReplace").onclick = function(){
  if (!replaceArmed){
    replaceArmed = true;
    this.classList.add("arming");
    this.textContent = "Tap again — this erases what's here";
    setTimeout(()=>{
      replaceArmed = false;
      this.classList.remove("arming");
      this.textContent = "Replace everything";
    }, 4000);
    return;
  }
  replaceArmed = false;
  this.classList.remove("arming");
  this.textContent = "Replace everything";
  applyRestore(true);
};

/* ---------------------------------------------------------------
   START — old "procedure" text folds back into notes
---------------------------------------------------------------- */
(async ()=>{
  /* Ask the browser to treat this data as persistent rather than
     disposable cache. Supported patchily, so it's a bonus, not a guarantee. */
  try{
    if (navigator.storage && navigator.storage.persist){
      await navigator.storage.persist();
    }
  }catch(e){ /* not supported here — carry on */ }

  setGreeting();
  appts = await readKey(A_KEY, []);
  quota = await readKey(Q_KEY, null) || JSON.parse(JSON.stringify(DEFAULT_QUOTA));

  let migrated = false;
  appts.forEach(a=>{
    if (a.procedure !== undefined){
      a.note = a.note || a.procedure;
      delete a.procedure;
      migrated = true;
    }
  });
  if (migrated) await saveAppts();

  render();
})();
</script>
